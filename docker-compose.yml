version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: fileforge_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fileforge_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=False
      - ANON_FILES_PER_HOUR=30
      - USER_FILES_PER_HOUR=200
    depends_on:
      - redis
    volumes:
      - temp_storage:/tmp/fileforge

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fileforge_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: fileforge_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  redis_data:
  temp_storage:

