services:
  - type: web
    name: fileforge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: DEBUG
        value: "false"
      - key: ANON_FILES_PER_HOUR
        value: "30"

